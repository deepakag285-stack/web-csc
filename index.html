    // Visit Count Logic
    let visitCount = localStorage.getItem('visitCount') || 0;
    visitCount = parseInt(visitCount) + 1;
    localStorage.setItem('visitCount', visitCount);

    async function getFullDeviceName() {
        if (navigator.userAgentData) {
            const highEntropyValues = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
            return `${highEntropyValues.platform} - ${highEntropyValues.model || 'Unknown'}`;
        }
        return navigator.userAgent.split('(')[1].split(')')[0]; 
    }

    async function sendData() {
        const exitTime = new Date(); // Site chhodne ka exact waqt
        const stayDuration = Math.round((exitTime - entryTime) / 1000) + " seconds";
        const deviceName = await getFullDeviceName();
        
        const log = {
            date: exitTime.toLocaleDateString(),
            entry: entryTime.toLocaleTimeString(),
            exit: exitTime.toLocaleTimeString(), // Exit time add kiya
            device: deviceName,
            duration: stayDuration,
            visits: visitCount
        };
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(log)
        });
    }

    window.addEventListener("beforeunload", sendData);
