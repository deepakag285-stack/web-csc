     const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx7FcP7I0CvcG23T7hySDX3iVER5hGYMejQkf45CWaSsaR9IDWcWSEkcMpOfFvhkpMT/exec"; 

     const entryTime = new Date(); // Site khulne ka exact waqt

    // Visit Count Logic
    let visitCount = localStorage.getItem('visitCount') || 0;
    visitCount = parseInt(visitCount) + 1;
    localStorage.setItem('visitCount', visitCount);

    async function getFullDeviceName() {
        if (navigator.userAgentData) {
            const highEntropyValues = await navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
            return `${highEntropyValues.platform} - ${highEntropyValues.model || 'Unknown'}`;
        }
        return navigator.userAgent.split('(')[1].split(')')[0]; 
    }

    async function sendData() {
        const exitTime = new Date(); // Site chhodne ka exact waqt
        const stayDuration = Math.round((exitTime - entryTime) / 1000) + " seconds";
        const deviceName = await getFullDeviceName();
        
        const log = {
            date: exitTime.toLocaleDateString(),
            entry: entryTime.toLocaleTimeString(),
            exit: exitTime.toLocaleTimeString(), // Exit time add kiya
            device: deviceName,
            duration: stayDuration,
            visits: visitCount
        };
        
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(log)
        });
    }

    window.addEventListener("beforeunload", sendData);
</script>

 <script> 
 let currentIndex = 0;
const slides = document.querySelectorAll('.slide');

function changeSlide(direction) {
    // 1. Remove 'active' class from current slide
    slides[currentIndex].classList.remove('active');

    // 2. Update the index
    currentIndex += direction;

    // 3. Handle Looping (if at end, go to start; if at start, go to end)
    if (currentIndex >= slides.length) {
        currentIndex = 0;
    } else if (currentIndex < 0) {
        currentIndex = slides.length - 1;
    }

    // 4. Add 'active' class to the new slide
    slides[currentIndex].classList.add('active');
}
// Optional: Auto-play every 5 seconds
setInterval(() => changeSlide(1), 2000);
</script>

 let lastKnownBody = ""; // Pehle body kuch nahi thi

async function checkForUpdates() {
  try {
    const response = await fetch('data.json');
    const data = await response.json();

    // Check karein kya nayi body purani body se alag hai?
    if (data.body !== lastKnownBody) {
      showNotif(data.title, data.body);
      
      // Ab nayi body ko save kar lo taake agli baar compare ho sake
      lastKnownBody = data.body;
    }
  } catch (err) {
    console.log("Error:", err);
  }
}

    function showNotif(title, body) {
      if (Notification.permission === 'granted') {
        navigator.serviceWorker.ready.then((reg) => {
          reg.showNotification(title, { body: body, icon: 'favicon.ico' });
        });
      }
    }

    // Har 30 seconds mein check karein
    setInterval(checkForUpdates, 30000);
    
    // Page load hote hi pehli baar check karein
